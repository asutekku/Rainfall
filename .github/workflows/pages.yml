name: Deploy to GitHub Pages

# Build the game bundle and publish it to GitHub Pages on every push to master.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions the deploy needs (least-privilege).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # The committed package-lock.json is npm lockfileVersion 1, which bun
        # refuses to parse; drop it so bun resolves straight from package.json.
        run: |
          rm -f package-lock.json
          bun install

      - name: Build bundle
        # Minified for the deploy — three.js makes the unminified bundle large.
        run: bun run build:min

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/dist _site/src
          cp index.html _site/
          cp dist/bundle.js _site/dist/
          cp -r src/css _site/src/css
          cp -r src/media _site/src/media

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
